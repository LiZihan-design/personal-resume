<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>陈思睿 · 个人简历</title>
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --primary: #1e3a5f;
            --primary-light: #2d5a8a;
            --primary-dark: #0f1f33;
            --accent: #c9a84c;
            --accent-light: #e0c86a;
            --accent-glow: rgba(201, 168, 76, 0.25);
            --bg: #f8f6f2;
            --bg-card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #4a4a5a;
            --text-muted: #7a7a8a;
            --border: #e8e4de;
            --shadow: 0 8px 30px rgba(26, 42, 74, 0.08);
            --shadow-hover: 0 16px 48px rgba(26, 42, 74, 0.14);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            --nav-blur: rgba(248, 246, 242, 0.82);
        }

        [data-theme="dark"] {
            --bg: #12121a;
            --bg-card: #1c1c2e;
            --text: #e8e6e3;
            --text-secondary: #b8b6b3;
            --text-muted: #888;
            --border: #2a2a3e;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.6);
            --nav-blur: rgba(18, 18, 26, 0.88);
            --accent-glow: rgba(201, 168, 76, 0.15);
        }

        /* ===== 重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-top: 68px;
            transition: background var(--transition), color var(--transition);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--accent);
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 8px;
        }

        /* ===== 工具类 ===== */
        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .section {
            padding: 56px 0 48px;
            border-bottom: 1px solid var(--border);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.5s ease forwards;
        }
        .section:last-of-type {
            border-bottom: none;
        }

        .section-label {
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 28px;
            position: relative;
            display: inline-block;
        }
        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 48px;
            height: 3px;
            background: var(--accent);
            border-radius: 4px;
        }
        .section-title.centered::after {
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .text-muted {
            color: var(--text-muted);
        }
        .text-accent {
            color: var(--accent);
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--nav-blur);
            backdrop-filter: blur(12px) saturate(1.2);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background var(--transition), border-color var(--transition);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text);
            letter-spacing: -0.02em;
            white-space: nowrap;
        }
        .navbar-brand span {
            color: var(--accent);
        }

        .navbar-links {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .navbar-links a {
            font-size: 0.82rem;
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .navbar-links a:hover,
        .navbar-links a.active {
            color: var(--text);
            background: var(--accent-glow);
        }

        .navbar-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            margin-left: 4px;
        }

        .navbar-actions button {
            background: none;
            border: none;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--text-secondary);
            transition: all var(--transition);
            background: transparent;
        }
        .navbar-actions button:hover {
            background: var(--accent-glow);
            color: var(--text);
        }

        /* ===== Hero ===== */
        .hero {
            padding: 48px 0 40px;
            text-align: center;
        }
        .hero-avatar {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hero-avatar:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-hover);
        }
        .hero-name {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 4px;
        }
        .hero-name .highlight {
            color: var(--accent);
        }
        .hero-title {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 16px;
        }
        .hero-desc {
            max-width: 720px;
            margin: 0 auto 20px;
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 22px;
        }
        .hero-tags .tag {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 4px 16px;
            border-radius: 24px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all var(--transition);
        }
        .hero-tags .tag:hover {
            border-color: var(--accent);
            color: var(--text);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
            font-family: var(--font);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-light);
            border-color: var(--primary-light);
            color: #fff;
        }
        .btn-accent {
            background: var(--accent);
            color: #1a1a2e;
            border-color: var(--accent);
        }
        .btn-accent:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
            color: #1a1a2e;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            border-color: var(--text);
            background: var(--bg-card);
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 0.8rem;
        }

        /* ===== 亮点成果 ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 8px;
        }
        .highlight-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 20px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .highlight-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.1;
            margin-bottom: 2px;
        }
        .highlight-number .suffix {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .highlight-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ===== Tabs 通用 ===== */
        .tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 2px;
            margin-bottom: 28px;
        }
        .tabs-nav button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: all var(--transition);
            font-family: var(--font);
            position: relative;
        }
        .tabs-nav button::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: var(--accent);
            border-radius: 4px;
            transition: width var(--transition);
        }
        .tabs-nav button:hover {
            color: var(--text);
            background: var(--accent-glow);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--text);
        }
        .tabs-nav button[aria-selected="true"]::after {
            width: 60%;
        }

        .tab-panel {
            display: none;
            animation: fadeUp 0.3s ease forwards;
        }
        .tab-panel[aria-hidden="false"] {
            display: block;
        }

        /* ===== 经历卡片 ===== */
        .exp-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px 28px 22px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            margin-bottom: 20px;
        }
        .exp-item:last-child {
            margin-bottom: 0;
        }
        .exp-item:hover {
            box-shadow: var(--shadow-hover);
        }

        .exp-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }
        .exp-company {
            font-size: 1.2rem;
            font-weight: 700;
        }
        .exp-company .badge {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 2px 12px;
            border-radius: 20px;
            margin-left: 8px;
            display: inline-block;
        }
        .exp-role {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 2px;
        }
        .exp-date {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }
        .exp-location {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .exp-desc {
            margin-top: 12px;
            padding-left: 0;
            list-style: none;
        }
        .exp-desc li {
            position: relative;
            padding-left: 22px;
            margin-bottom: 8px;
            font-size: 0.93rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .exp-desc li::before {
            content: '▹';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 700;
        }
        .exp-desc li strong {
            color: var(--text);
            font-weight: 600;
        }

        /* ===== 项目卡片 ===== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        .project-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 24px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .project-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .project-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .project-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0 10px;
        }
        .project-stack .stack-tag {
            font-size: 0.7rem;
            background: var(--accent-glow);
            color: var(--accent);
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .project-desc {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
            flex: 1;
        }
        .project-desc ul {
            list-style: none;
            padding-left: 0;
            margin-top: 4px;
        }
        .project-desc ul li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 4px;
            font-size: 0.88rem;
        }
        .project-desc ul li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--accent);
        }
        .project-link {
            margin-top: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .project-link:hover {
            color: var(--primary);
        }

        /* ===== 技能矩阵 ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px 32px;
        }
        .skill-category {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 20px 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .skill-category:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .skill-category h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: 0.02em;
            border-bottom: 2px solid var(--accent-glow);
            padding-bottom: 6px;
            display: inline-block;
        }
        .skill-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }
        .skill-item .name {
            font-weight: 500;
        }
        .skill-item .level {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            background: var(--bg);
            padding: 0 10px;
            border-radius: 12px;
            line-height: 20px;
        }
        .skill-bar {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin-top: 2px;
            overflow: hidden;
        }
        .skill-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            transition: width 0.6s ease;
            width: 0;
        }

        /* ===== 教育 & 证书 ===== */
        .edu-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 28px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            transition: all var(--transition);
        }
        .edu-item:hover {
            box-shadow: var(--shadow-hover);
        }
        .edu-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
        }
        .edu-school {
            font-size: 1.15rem;
            font-weight: 700;
        }
        .edu-major {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .edu-date {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .edu-detail {
            margin-top: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .edu-detail .label {
            font-weight: 600;
            color: var(--text);
        }

        .certs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        .cert-item {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            border: 1px solid var(--border);
            font-size: 0.88rem;
            color: var(--text-secondary);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cert-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .cert-item .cert-icon {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem;
        }
        .cert-item .cert-name {
            font-weight: 500;
            color: var(--text);
        }
        .cert-item .cert-year {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-left: auto;
            white-space: nowrap;
        }

        /* ===== 页脚 ===== */
        .footer {
            padding: 32px 0 24px;
            text-align: center;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .footer a {
            color: var(--text-muted);
            transition: color var(--transition);
        }
        .footer a:hover {
            color: var(--accent);
        }

        /* ===== 返回顶部 ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: var(--shadow-hover);
            transition: all var(--transition);
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .back-top:hover {
            background: var(--accent);
            transform: scale(1.06);
            color: #1a1a2e;
        }

        /* ===== 打印样式 ===== */
        @media print {
            body {
                padding-top: 0;
                background: #fff;
                color: #000;
            }
            .navbar,
            .back-top,
            .btn,
            .hero-actions .btn {
                display: none !important;
            }
            .section {
                padding: 20px 0 16px;
                opacity: 1 !important;
                transform: none !important;
                animation: none !important;
                border-bottom-color: #ddd;
            }
            .section-title {
                font-size: 1.4rem;
            }
            .container {
                max-width: 100%;
                padding: 0 16px;
            }
            .highlight-card,
            .exp-item,
            .project-card,
            .skill-category,
            .edu-item,
            .cert-item {
                box-shadow: none !important;
                border: 1px solid #ddd;
                transform: none !important;
                background: #fafafa;
            }
            .hero-name {
                font-size: 2.4rem;
            }
            .hero-avatar {
                width: 80px;
                height: 80px;
                border-width: 2px;
            }
            .tabs-nav button {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            .tab-panel {
                display: block !important;
            }
            .tab-panel[aria-hidden="true"] {
                display: none !important;
            }
            .tabs-nav {
                border-bottom-color: #ddd;
            }
            .project-grid {
                grid-template-columns: 1fr 1fr;
            }
            .highlights-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .skills-grid {
                grid-template-columns: 1fr 1fr;
            }
            .certs-grid {
                grid-template-columns: 1fr 1fr;
            }
            .exp-header {
                flex-wrap: nowrap;
            }
            .exp-item {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .project-card {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .navbar-actions {
                display: none !important;
            }
            [data-theme="dark"] {
                --bg: #fff;
                --bg-card: #fafafa;
                --text: #000;
                --text-secondary: #333;
                --text-muted: #666;

                const btn = document.createElement('button');
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
                btn.setAttribute('aria-controls', `exp-panel-${i}`);
                btn.setAttribute('id', `exp-tab-${i}`);
                btn.textContent = exp.company.split('(')[0].trim();
                if (exp.badge) {
                    const badge = document.createElement('span');
                    badge.style.cssText =
                        'font-size:0.6rem;background:var(--accent-glow);color:var(--accent);padding:0 8px;border-radius:12px;margin-left:4px;font-weight:600;';
                    badge.textContent = exp.badge;
                    btn.appendChild(badge);
                }
                btn.addEventListener('click', () => switchExpTab(i));
                expNav.appendChild(btn);

                const panel = document.createElement('div');
                panel.setAttribute('role', 'tabpanel');
                panel.setAttribute('id', `exp-panel-${i}`);
                panel.setAttribute('aria-labelledby', `exp-tab-${i}`);
                panel.setAttribute('aria-hidden', i === 0 ? 'false' : 'true');
                panel.className = 'tab-panel';
                panel.innerHTML = buildExpItem(exp);
                expPanels.appendChild(panel);
            });

            function switchExpTab(idx) {
                $$('[role="tab"]', expNav).forEach((btn, i) => {
                    const sel = i === idx;
                    btn.setAttribute('aria-selected', sel ? 'true' : 'false');
                });
                $$('[role="tabpanel"]', expPanels).forEach((panel, i) => {
                    panel.setAttribute('aria-hidden', i === idx ? 'false' : 'true');
                });
                expActive = idx;
            }

            function buildExpItem(exp) {
                return `
                    <div class="exp-item">
                        <div class="exp-header">
                            <div>
                                <div class="exp-company">${exp.company} <span class="badge">${exp.badge || ''}</span></div>
                                <div class="exp-role">${exp.role}</div>
                            </div>
                            <div style="text-align:right;">
                                <div class="exp-date">${exp.date}</div>
                                <div class="exp-location">${exp.location}</div>
                            </div>
                        </div>
                        <ul class="exp-desc">
                            ${exp.points.map(p => `<li>${p}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            // ---- 项目 Tabs ----
            const projNav = document.getElementById('projTabsNav');
            const projPanels = document.getElementById('projPanels');
            let projActive = 0;

            resume.projects.forEach((proj, i) => {
                const btn = document.createElement('button');
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
                btn.setAttribute('aria-controls', `proj-panel-${i}`);
                btn.setAttribute('id', `proj-tab-${i}`);
                btn.textContent = proj.name.length > 18 ? proj.name.slice(0, 16) + '…' : proj.name;
                btn.addEventListener('click', () => switchProjTab(i));
                projNav.appendChild(btn);

                const panel = document.createElement('div');
                panel.setAttribute('role', 'tabpanel');
                panel.setAttribute('id', `proj-panel-${i}`);
                panel.setAttribute('aria-labelledby', `proj-tab-${i}`);
                panel.setAttribute('aria-hidden', i === 0 ? 'false' : 'true');
                panel.className = 'tab-panel';
                panel.innerHTML = `
                    <div class="project-grid">
                        <div class="project-card">
                            <div class="project-name">${proj.name}</div>
                            <div class="project-meta">${proj.meta}</div>
                            <div class="project-stack">${proj.stack.map(s => `<span class="stack-tag">${s}</span>`).join('')}</div>
                            <div class="project-desc">
                                <ul>${proj.points.map(p => `<li>${p}</li>`).join('')}</ul>
                            </div>
                            ${proj.link ? `<a href="${proj.link}" target="_blank" rel="noopener" class="project-link">🔗 查看项目</a>` : ''}
                        </div>
                    </div>
                `;
                projPanels.appendChild(panel);
            });

            function switchProjTab(idx) {
                $$('[role="tab"]', projNav).forEach((btn, i) => {
                    btn.setAttribute('aria-selected', i === idx ? 'true' : 'false');
                });
                $$('[role="tabpanel"]', projPanels).forEach((panel, i) => {
                    panel.setAttribute('aria-hidden', i === idx ? 'false' : 'true');
                });
                projActive = idx;
            }

            // ---- 技能 ----
            const skillsGrid = document.getElementById('skillsGrid');
            resume.skills.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'skill-category';
                let html = `<h4>${cat.category}</h4>`;
                cat.items.forEach(item => {
                    const pct = Math.min(item.level, 100);
                    html += `
                        <div class="skill-item">
                            <span class="name">${item.name}</span>
                            <span class="level">${pct}%</span>
                        </div>
                        <div class="skill-bar"><div class="fill" style="width:${pct}%;"></div></div>
                    `;
                });
                div.innerHTML = html;
                skillsGrid.appendChild(div);
            });

            // ---- 教育 ----
            const edu = resume.education;
            const eduContainer = document.getElementById('eduContainer');
            eduContainer.innerHTML = `
                <div class="edu-item">
                    <div class="edu-header">
                        <div>
                            <div class="edu-school">${edu.school}</div>
                            <div class="edu-major">${edu.major}</div>
                        </div>
                        <div class="edu-date">${edu.date}</div>
                    </div>
                    <div class="edu-detail">
                        <div><span class="label">GPA：</span>${edu.gpa}</div>
                        <div><span class="label">主修课程：</span>${edu.courses}</div>
                        <div><span class="label">荣誉：</span>${edu.honors}</div>
                        <div><span class="label">标化：</span>${edu.tests}</div>
                    </div>
                </div>
            `;

            // ---- 证书 ----
            const certsGrid = document.getElementById('certsGrid');
            resume.certificates.forEach(cert => {
                const div = document.createElement('div');
                div.className = 'cert-item';
                div.innerHTML = `
                    <span class="cert-icon">✦</span>
                    <span class="cert-name">${cert.name}</span>
                    <span class="cert-year">${cert.year}</span>
                `;
                certsGrid.appendChild(div);
            });

            // ================================================================
            //  交互功能
            // ================================================================

            // ---- 主题切换 ----
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (localStorage.getItem('theme') === 'dark') dark = true;
            if (localStorage.getItem('theme') === 'light') dark = false;
            applyTheme(dark);

            themeToggle.addEventListener('click', () => {
                dark = !dark;
                applyTheme(dark);
                localStorage.setItem('theme', dark ? 'dark' : 'light');
            });

            function applyTheme(isDark) {
                if (isDark) {
                    html.setAttribute('data-theme', 'dark');
                    themeToggle.textContent = '☀️';
                } else {
                    html.removeAttribute('data-theme');
                    themeToggle.textContent = '🌓';
                }
            }

            // ---- 打印 ----
            function printResume() {
                window.print();
            }
            document.getElementById('printBtn').addEventListener('click', printResume);
            document.getElementById('printBtn2').addEventListener('click', printResume);
            document.getElementById('footerPrint').addEventListener('click', (e) => { e.preventDefault();
                printResume(); });

            // ---- 邮箱复制 ----
            document.getElementById('emailBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(realEmail).then(() => {
                    const btn = document.getElementById('emailBtn');
                    const orig = btn.textContent;
                    btn.textContent = '✅ 已复制';
                    setTimeout(() => { btn.textContent = orig; }, 2000);
                }).catch(() => {
                    // fallback
                    const input = document.createElement('input');
                    input.value = realEmail;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    const btn = document.getElementById('emailBtn');
                    const orig = btn.textContent;
                    btn.textContent = '✅ 已复制';
                    setTimeout(() => { btn.textContent = orig; }, 2000);
                });
            });

            // ---- 返回顶部 ----
            const backTop = document.getElementById('backTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) {
                    backTop.classList.add('visible');
                } else {
                    backTop.classList.remove('visible');
                }
            });
            backTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ---- 键盘导航 Tabs ----
            function setupKeyboardTabs(navId, switchFn, count) {
                const nav = document.getElementById(navId);
                nav.addEventListener('keydown', (e) => {
                    const btns = $$('[role="tab"]', nav);
                    const current = btns.findIndex(b => b.getAttribute('aria-selected') === 'true');
                    let next = current;
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        next = (current + 1) % btns.length;
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        next = (current - 1 + btns.length) % btns.length;
                    } else if (e.key === 'Home') {
                        e.preventDefault();
                        next = 0;
                    } else if (e.key === 'End') {
                        e.preventDefault();
                        next = btns.length - 1;
                    } else {
                        return;
                    }
                    btns[next].focus();
                    switchFn(next);
                });
            }
            setupKeyboardTabs('expTabsNav', switchExpTab, resume.experiences.length);
            setupKeyboardTabs('projTabsNav', switchProjTab, resume.projects.length);

            // ---- 导航高亮 ----
            const navLinks = $$('.navbar-links a:not(.hide-mobile)');
            const sections = ['hero', 'highlights', 'experience', 'projects', 'skills', 'education'];
            window.addEventListener('scroll', () => {
                let current = '';
                sections.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        const rect = el.getBoundingClientRect();
                        if (rect.top <= 100) current = id;
                    }
                });
                navLinks.forEach(a => {
                    a.classList.toggle('active', a.getAttribute('href') === '#' + current);
                });
            });

            // ---- 加载完成标记 ----
            document.body.classList.add('js-loaded');

            // ---- 修正导航栏手机适配 ----
            // 在小屏幕下隐藏部分导航文字，保留图标
            if (window.innerWidth < 480) {
                navLinks.forEach(a => {
                    if (a.textContent.length > 2) a.classList.add('hide-mobile');
                });
            }

            // ---- 所有 skill-bar 延迟填充动画 ----
            setTimeout(() => {
                $$('.skill-bar .fill').forEach(el => {
                    const w = el.style.width;
                    el.style.width = '0';
                    requestAnimationFrame(() => {
                        el.style.width = w;
                    });
                });
            }, 300);

        }); // end DOMContentLoaded
    </script>
</body>
</html>
